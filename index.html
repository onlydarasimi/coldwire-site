var cards=[['Transport manager','Tue 10:00'],['Estimator','Wed 14:30'],['Plant manager','Mon 09:15'],['Fleet manager','Thu 11:00'],['Operations manager','Fri 13:00']];

}
function arrive(){

function frame(t){

    if(o.dead)return;

mount('s-get',function(R){

    var n=document.createElement('div');n.className='nm';var s=document.createElement('strong');s.textContent=d[0];var sm=document.createElement('small');sm.textContent=d[1]+' · booked';n.appendChild(s);n.appendChild(sm);r.appendChild(n);
    for(var k=1;k<=3;k++){var t=document.createElement('div');t.className='tk t'+k;t.textContent='\u2713';r.appendChild(t)}
    var st=document.createElement('div');st.className='st';r.appendChild(st);
    rows.appendChild(r);
  });
  cnt.textContent='0';pay.classList.remove('show');
}
function later(f,ms){if(reduce){f();return}timers.push(setTimeout(f,ms))}
function run(){
  timers.forEach(clearTimeout);timers=[];build();
  var counted=0,kids=[].slice.call(rows.children);
  kids.forEach(function(r,i){
    var base=i*1500+200,ok=data[i][2];

    var tks=[].slice.call(r.querySelectorAll('.tk')),st=r.querySelector('.st'),pass=true;
    tks.forEach(function(t,k){

}

build();
if(reduce){run();return}

})();

});
